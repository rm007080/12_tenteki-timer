<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'">
  <title>点滴タイマー</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./calc.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="app-header">
      <h1 id="app-title">点滴タイマー</h1>
      <p class="notice">自然滴下の計算補助です。指示・施設ルールに従って確認してください。</p>
    </header>

    <form class="input-panel" id="calculation-form" novalidate>
      <div class="field">
        <label for="volume-input">現在バッグの残量</label>
        <div class="input-with-unit">
          <input
            id="volume-input"
            name="volume"
            type="number"
            inputmode="decimal"
            autocomplete="off"
            min="0"
            step="any"
            aria-describedby="volume-error"
          >
          <span class="unit">mL</span>
        </div>
        <p class="error-message" id="volume-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="end-time-input">終了予定時刻</label>
        <input
          id="end-time-input"
          name="endTime"
          type="time"
          autocomplete="off"
          aria-describedby="end-time-error"
        >
        <p class="error-message" id="end-time-error" aria-live="polite"></p>
      </div>

      <fieldset class="drop-factor-group">
        <legend>滴下係数</legend>
        <div class="drop-factor-buttons" id="drop-factor-buttons">
          <button class="factor-button" type="button" data-drop-factor="15" aria-pressed="false">15滴/mL</button>
          <button class="factor-button is-selected" type="button" data-drop-factor="20" aria-pressed="true">20滴/mL</button>
          <button class="factor-button" type="button" data-drop-factor="60" aria-pressed="false">60滴/mL</button>
        </div>
        <p class="error-message" id="drop-factor-error" aria-live="polite"></p>
      </fieldset>

      <button class="calculate-button" type="submit">計算する</button>
    </form>

    <section class="result-panel" id="result-panel" aria-labelledby="result-title">
      <h2 id="result-title">計算結果</h2>
      <div class="result-output" aria-live="polite" aria-atomic="true">
        <p class="main-result" id="main-result">結果はここに表示されます</p>
        <p class="drops-result" id="drops-result"></p>
        <p class="ml-result" id="ml-result"></p>
        <p class="condition-text" id="condition-text"></p>
      </div>
      <p class="stale-result" id="stale-result" aria-live="polite" hidden>
        前回の計算結果です。新しい条件は計算すると反映されます。
      </p>
      <div class="second-clock" id="second-clock">
        <p class="clock-label">現在秒</p>
        <p class="clock-note">現在時刻の秒です。滴下タイミングを示すものではありません。</p>
        <svg class="clock-svg" viewBox="0 0 160 160" aria-hidden="true" focusable="false">
          <circle class="clock-face" cx="80" cy="80" r="74"></circle>
          <g class="clock-numbers" id="clock-numbers"></g>
          <g class="clock-ticks" id="clock-ticks"></g>
          <line class="clock-hand" id="clock-hand"></line>
          <circle class="clock-center" cx="80" cy="80" r="3.5"></circle>
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
